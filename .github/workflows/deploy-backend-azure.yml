# Despliegue del backend a Azure App Service.
#
#   push a dev   -> stage
#   push a main  -> prod (con revisores obligatorios del Environment `prod`)
#   workflow_dispatch(environment, ref) -> cualquier commit; es el ROLLBACK:
#     scripts/azure.ps1 -Command rollback -Env prod
#
# Sin deployment slots (plan B1): cada despliegue reemplaza el código en el
# mismo Web App y el health check de la plataforma espera a que arranque.
#
# Migraciones: `prisma migrate deploy` corre ANTES de publicar el código nuevo,
# abriendo una regla temporal de firewall para la IP del runner que se cierra
# siempre (if: always()). Son solo hacia adelante: el rollback NO las revierte,
# por eso deben ser compatibles con el código anterior (expandir/contraer).
#
# Guard: no corre mientras la variable de repositorio AZURE_DEPLOY_ENABLED no sea
# 'true'. Guía: infra/README.md. Paquete: documentacion/azure/PREPARACION.md §3.
name: Deploy backend (Azure)
run-name: >-
  Backend ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'stage') }}
  @ ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-azure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno"
        type: choice
        options: [stage, prod]
        required: true
        default: stage
      ref:
        description: "Commit (SHA), tag o rama a desplegar. Vacío = la rama desde la que se lanza."
        type: string
        required: false
        default: ""
      skip_migrations:
        description: "No ejecutar prisma migrate deploy (rollback a código anterior)"
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'stage') }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'stage') }}
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  build:
    name: Build y pruebas
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Sin id-token: este job ejecuta scripts de npm y no debe poder pedir un
    # token de Azure.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      prisma_version: ${{ steps.meta.outputs.prisma_version }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (con dev)
        run: npm ci

      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Pruebas unitarias
        run: npm test

      - name: Build (prisma generate + tsc)
        run: npm run build

      - name: Podar devDependencies
        # `npm prune` respeta node_modules/.prisma (cliente generado). NO usar
        # `npm ci --omit=dev`: reinstalaría @prisma/client como stub.
        run: npm prune --omit=dev

      - name: Verificar el motor de Prisma para App Service Linux
        run: |
          test -f node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node \
            || { echo "::error::Falta libquery_engine-debian-openssl-3.0.x.so.node (¿binaryTargets en schema.prisma?)"; exit 1; }
          test -f dist/server.js || { echo "::error::Falta dist/server.js"; exit 1; }

      - name: Empaquetar
        # dist/ + node_modules podado + package.json ("type": "module") +
        # package-lock.json (trazabilidad) + prisma/ (referencia del esquema).
        # node_modules/.bin se excluye: son enlaces simbólicos que no se usan en runtime.
        run: |
          zip -qr ../backend.zip dist node_modules package.json package-lock.json prisma -x 'node_modules/.bin/*'
          ls -lh ../backend.zip

      - name: Metadatos
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # La CLI ya se podó: la versión sale del lockfile.
          echo "prisma_version=$(jq -r '.packages["node_modules/prisma"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy ${{ needs.build.outputs.sha }}
    needs: build
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'stage') }}
      url: ${{ vars.AZURE_API_URL }}/health
    steps:
      - name: Checkout (solo prisma/)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          sparse-checkout: backend/prisma

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Abrir firewall de Postgres para este runner
        id: fw
        if: ${{ !inputs.skip_migrations }}
        run: |
          ip="$(curl -fsS https://api.ipify.org)"
          rule="gh-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_POSTGRES_SERVER }}" \
            --rule-name "$rule" \
            --start-ip-address "$ip" --end-ip-address "$ip" \
            --only-show-errors -o none
          echo "Regla $rule abierta para $ip"

      - name: Migraciones (prisma migrate deploy)
        if: ${{ !inputs.skip_migrations }}
        working-directory: backend
        env:
          PRISMA_VERSION: ${{ needs.build.outputs.prisma_version }}
        run: |
          DATABASE_URL="$(az keyvault secret show --vault-name "${{ vars.AZURE_KEYVAULT_NAME }}" -n database-url --query value -o tsv)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export DIRECT_URL="$DATABASE_URL"
          # Misma versión de la CLI que el lockfile del commit desplegado.
          npx --yes "prisma@${PRISMA_VERSION}" migrate deploy --schema prisma/schema.prisma

      - name: Cerrar firewall de Postgres
        if: always() && steps.fw.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_POSTGRES_SERVER }}" \
            --rule-name "${{ steps.fw.outputs.rule }}" \
            --yes --only-show-errors

      - name: Publicar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend.zip
          type: zip
          clean: true
          restart: true

      - name: Smoke - esperar /health 200
        # backend/scripts/smoke.mjs crea proyectos y consultores de prueba y
        # necesita un token: no sirve contra stage/prod. Aquí solo /health.
        env:
          API_URL: ${{ vars.AZURE_API_URL }}
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o health.json -w '%{http_code}' --max-time 15 "$API_URL/health" || true)"
            if [[ "$code" == "200" ]] && jq -e '.ok == true' health.json > /dev/null; then
              echo "OK en el intento $i:"; jq . health.json
              {
                echo "### Backend ${TARGET_ENV} desplegado"
                echo ""
                echo "- Commit: \`${{ needs.build.outputs.sha }}\`"
                echo "- API: ${API_URL}"
                echo "- Migraciones: ${{ inputs.skip_migrations && 'omitidas' || 'aplicadas' }}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $i: HTTP $code; reintento en 10 s"
            sleep 10
          done
          echo "::error::/health no devolvió 200 en 5 minutos. Revisa: scripts/azure.ps1 -Command logs -Env ${TARGET_ENV}"
          cat health.json 2>/dev/null || true
          exit 1
